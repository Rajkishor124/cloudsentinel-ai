# Development profile - H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:incidentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

# JWT (dev defaults)
app:
  jwt:
    secret: dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days

# Simulator
simulator:
  max-episode-ticks: 200
  tick-rate-ms: 500
  max-latency: 1000
