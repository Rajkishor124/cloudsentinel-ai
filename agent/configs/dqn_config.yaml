# DQN Training Configuration

algorithm: DQN
policy: MlpPolicy

# Environment
env:
  api_url: "http://localhost:8080"
  difficulty: "SIMPLE"
  history_len: 4

# Training
training:
  total_timesteps: 500000
  learning_rate: 0.0001
  buffer_size: 100000
  batch_size: 64
  gamma: 0.99
  exploration_fraction: 0.1
  exploration_final_eps: 0.05
  train_freq: 4
  gradient_steps: 4
  target_update_interval: 1000

# Callbacks
callbacks:
  checkpoint_freq: 50000
  log_dir: "logs"
  checkpoint_dir: "checkpoints"

# Evaluation
eval:
  n_episodes: 10
  eval_freq: 25000
